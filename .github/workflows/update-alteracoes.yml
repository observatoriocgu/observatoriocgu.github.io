name: Atualizar histórico de alterações do dados.csv

on:
  push:
    branches:
      - main
    paths:
      - 'evasao/data/dados.csv'

concurrency:
  group: atualizar-historico-alteracoes-main
  cancel-in-progress: false

jobs:
  gerar-alteracoes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerar arquivo de alterações
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/generate-alteracoes.js
        working-directory: evasao

      - name: Commit e push do arquivo gerado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Só o público-fonte é versionado: evasao/dist/ passou a ser artefato
          # de build, regenerado pelo workflow deploy-pages.yml a cada publicação.
          git add \
            evasao/public/alteracoes.json \
            evasao/public/alteracoes-registros.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza histórico de alterações do dados.csv"
            git push
          else
            echo "Nenhuma alteração nos arquivos de histórico"
          fi
        shell: bash
