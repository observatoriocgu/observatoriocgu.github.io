name: Atualizar saídas do DOU (AFFC)

# Varre o Diário Oficial da União, registra as saídas de AFFC no índice de atos
# e regera o card "dias sem perder um Auditor" a partir dele.
#
# São dois passos porque um tem rede e o outro não: `varrer_dou.py` busca no
# in.gov.br, `resumir_dou.py` só relê arquivo. O segundo NÃO depende dos
# snapshots do Portal da Transparência, que não estão no Git — é por isso que o
# card pode ser regerado aqui, enquanto o `construir_painel.py` só roda na
# máquina de quem tem os snapshots.
#
# O JSON gerado guarda DATAS, não a contagem de dias — o navegador calcula
# "faz N dias" ao renderizar. Por isso o card continua correto mesmo se este
# workflow falhar por alguns dias: ele só ficaria sem descobrir uma saída nova.

on:
  schedule:
    # 09:00 UTC = 06:00 em Brasília, depois da publicação do DOU do dia.
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: saidas-dou
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Varrer o DOU e registrar os atos
        run: python scripts/varrer_dou.py
        working-directory: evasao

      - name: Regerar o card a partir do índice
        run: python scripts/resumir_dou.py
        working-directory: evasao

      - name: Commit e push do que mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A camada inteira do DOU, e não arquivo por arquivo: desde a D30 ela
          # tem dois índices e duas pastas de cópias, e listar caminho a caminho
          # é como se esquece de commitar o que passou a existir.
          git add evasao/data/dou evasao/public/dou.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza saídas de AFFC publicadas no DOU"
            git push
          else
            echo "Nenhuma saída nova no DOU"
          fi
        shell: bash
