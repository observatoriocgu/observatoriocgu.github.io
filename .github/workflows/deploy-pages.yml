name: Publicar site no GitHub Pages

# Este workflow substitui a publicação "servir a branch main".
# Ele builda o projeto Vite e entrega o resultado pronto para o GitHub Pages.
#
# PRÉ-REQUISITO (uma vez só): em Settings -> Pages -> Build and deployment,
# trocar "Source" de "Deploy from a branch" para "GitHub Actions".
# Enquanto isso não for feito, o passo "deploy" falha e o site continua
# sendo servido a partir da branch (evasao/dist/).

on:
  push:
    branches:
      - main
  # O push do crawler do DOU usa o GITHUB_TOKEN e, por regra do GitHub, não
  # dispara outros workflows. Sem este gatilho, uma atualização do
  # dias_sem_perder_affc.json nunca chegaria ao site publicado.
  #
  # O gatilho do antigo "Atualizar registros de alterações" saiu junto com o
  # workflow: o alteracoes-registros.json não é mais reconstruído do histórico
  # do Git, e sim gerado pelo diff mensal do SIAPE, em construir_painel.py.
  workflow_run:
    workflows:
      - "Atualizar saídas do DOU (AFFC)"
      # A rotina mensal do SIAPE (D32): quando ela commita uma competência nova,
      # o site tem de ser remontado para o `painel.csv` sair do `dados.csv` novo.
      - "Atualizar o quadro de AFFC da CGU (SIAPE)"
      # Mesma razão: o `destinos_ranking.csv` é lido em tempo de execução de
      # /evasao/data/, então ele só chega ao ar quando o site é remontado.
      - "Atualizar destinos de quem saiu da CGU (AFFC)"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: evasao/package-lock.json

      # A mescla das fontes externas roda aqui (D29). Ela é etapa de PUBLICAÇÃO:
      # o `prebuild` do npm chama `scripts/gerar_publicacao.py`, que lê quatro
      # arquivos versionados (dados.csv, dou.json, destinos_ranking.csv,
      # alteracoes-registros.json) e escreve os dois que o site de fato lê —
      # `data/painel.csv` e `public/alteracoes.json`.
      #
      # Ela roda AQUI, e não no `construir_painel.py`, porque as fontes que ela
      # junta mudam todo dia (a varredura do DOU) e toda semana (os destinos),
      # enquanto o painel é reconstruído uma vez por competência. Como este
      # workflow dispara a cada push e ao fim das rotinas de dados, uma saída
      # publicada hoje chega ao site hoje.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: npm ci
        working-directory: evasao

      # O `prebuild` roda antes do `vite build`, e o resumo dele (quantas saídas
      # o DOU acrescentou, quantos destinos o ranking preencheu) fica no log deste
      # passo — é o registro do que foi ao ar.
      - name: Build
        run: npm run build
        working-directory: evasao

      - name: Montar o site
        run: |
          set -euo pipefail
          mkdir -p _site

          # Impede o Jekyll de reprocessar o que já está pronto.
          touch _site/.nojekyll

          # Página raiz: redireciona observatoriocgu.github.io -> /evasao/
          cp index.html _site/index.html

          # O painel em si.
          mkdir -p _site/evasao
          cp -r evasao/dist/. _site/evasao/

          # Os CSVs são lidos em tempo de execução por /evasao/data/*.csv e não
          # passam pelo build (não estão em public/). Precisam ser copiados.
          #
          # O que a interface lê é o `painel.csv`, gerado no passo de build (D29).
          # Os demais vão junto de propósito: são as FONTES daquele arquivo, e um
          # observatório que não publica a própria fonte pede confiança em vez de
          # oferecer conferência.
          mkdir -p _site/evasao/data
          cp evasao/data/*.csv _site/evasao/data/

          # A camada do DOU mora em data/dou/ desde a D30, e o glob acima é RASO:
          # subpasta não entra sozinha. São dois índices (saída da CGU e destino
          # em outro órgão) e duas pastas de cópias — sem estas linhas, os links
          # dos atos dão 404.
          mkdir -p _site/evasao/data/dou
          cp evasao/data/dou/*.csv _site/evasao/data/dou/ 2>/dev/null || true
          for pasta in atos_saida atos_destino; do
            if [ -d "evasao/data/dou/$pasta" ]; then
              mkdir -p "_site/evasao/data/dou/$pasta"
              cp evasao/data/dou/$pasta/*.html "_site/evasao/data/dou/$pasta/" 2>/dev/null || true
            fi
          done

          echo "--- conteúdo publicado ---"
          find _site -maxdepth 2 -mindepth 1 | sort

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
